<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e4e8eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121518" media="(prefers-color-scheme: dark)" />
    <script>
      // apply a saved light/dark choice before first paint (no flash); no saved choice = follow the system
      try { var t = localStorage.getItem('analyst-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}
    </script>
    <meta name="description" content="Analyst Buddy is an AI data analyst for business owners: it runs the numbers on your own data and tells you what changed, why, and what to do." />
    <title>Analyst Buddy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
